name: 📸 Snapshot

on:
  workflow_call:
    inputs:
      run_tests:
        description: 'Run automated test suite before pre-release'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Dry run (preview snapshot version without committing, tagging, or pushing)'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run automated test suite before pre-release'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry run (preview snapshot version without committing, tagging, or pushing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  snapshot:
    name: 🧪 Create Snapshot Pre-Release
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Checkout Framework Tools
        if: github.repository != 'treevg/github-workflows'
        uses: actions/checkout@v4
        with:
          repository: treevg/github-workflows
          path: ${{ runner.temp }}/github-workflows

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🔧 Locate Release Script
        id: release_tool
        run: |
          if [ -f ".github/scripts/release_version.py" ]; then
            echo "path=.github/scripts/release_version.py" >> $GITHUB_OUTPUT
          else
            echo "path=${{ runner.temp }}/github-workflows/.github/scripts/release_version.py" >> $GITHUB_OUTPUT
          fi

      - name: 🔢 Calculate Snapshot Version
        id: version_bump
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python3 "${{ steps.release_tool.outputs.path }}" snapshot --branch "${{ github.ref_name }}" $DRY_RUN_FLAG

      - name: 🧪 Run Automated Tests
        if: ${{ (inputs.run_tests == null || inputs.run_tests != false) && hashFiles('.ci/actions/run-tests/action.yml') != '' }}
        uses: ./.ci/actions/run-tests

      - name: ✏️ Prepare Snapshot Codebase Changes
        if: ${{ inputs.dry_run != true && hashFiles('.ci/actions/prepare-release/action.yml') != '' }}
        uses: ./.ci/actions/prepare-release
        with:
          version: ${{ steps.version_bump.outputs.version }}
          is_prerelease: 'true'

      - name: 🧪 Deploy Snapshot / Staging
        if: ${{ inputs.dry_run != true && hashFiles('.ci/actions/deploy/action.yml') != '' }}
        uses: ./.ci/actions/deploy
        with:
          target: staging
          version: ${{ steps.version_bump.outputs.version }}

      - name: 🏷️ Tag & Publish Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version_bump.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "Error: Version not set by version_bump step." >&2
            exit 1
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN SNAPSHOT PREVIEW ==="
            echo "Snapshot Version: v$VERSION"
            echo "Branch Target:    origin/${{ github.ref_name }}"
            echo "Tag & Pre-Release creation skipped in dry run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit on-the-fly codebase preparation changes if any were made
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git add -u
            git commit -m "chore(snapshot): prepare v$VERSION"
            git push origin HEAD:${{ github.ref_name }}
          fi

          git tag -a "v$VERSION" -m "Snapshot v$VERSION"
          git push origin "v$VERSION"

          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --prerelease \
            --generate-notes
